plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'antlr'
}

group = 'vn.gov.cic.study'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    droolsVersion = '9.44.0.Final'
    antlrVersion = '4.13.2'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation platform("org.drools:drools-bom:${droolsVersion}")
    implementation 'org.drools:drools-core'
    implementation 'org.drools:drools-compiler'
    implementation 'org.drools:drools-decisiontables'
    implementation 'org.drools:drools-mvel'
    implementation 'org.drools:drools-model-compiler'

    implementation "org.antlr:antlr4-runtime:${antlrVersion}"
    antlr "org.antlr:antlr4:${antlrVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('generateGrammarSource') {
    arguments += ['-visitor', '-package', 'vn.gov.cic.study.drools.parser']
}

tasks.named('test') {
    useJUnitPlatform()
}
